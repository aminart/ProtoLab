name: Build Windows exe

# Fabrique ProtoLab.exe sur une machine Windows de GitHub, seulement pour une release publiée
# (tag vX.Y.Z, qui doit correspondre au fichier VERSION) ou à la main (onglet Actions) :
# économise les minutes GitHub Actions. L'exe est joint à la release : ProtoLab-X.Y.Z.exe.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ProtoLab $version"
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            if [ "$tag" != "v$version" ]; then
              echo "::error::Le tag $tag ne correspond pas au fichier VERSION ($version). Lancer scripts/bump_version.py avant la release."
              exit 1
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend et lecteur de prototype
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Exécutable
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
          pyinstaller --noconfirm ProtoLab.spec

      - name: Vérification (contrat du portail, import d'une maquette, export HTML)
        run: |
          ./dist/ProtoLab.exe --version
          export PROTOLAB_CONFIG_DIR="$RUNNER_TEMP/protolab"
          ./dist/ProtoLab.exe --port 8597 --no-browser &
          for i in $(seq 90); do curl -sf http://127.0.0.1:8597/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8597/health
          pid=$(curl -sf -H "Content-Type: application/json" -d '{"name":"CI"}' http://127.0.0.1:8597/api/projects | python -c "import json,sys;print(json.load(sys.stdin)['id'])")
          curl -sf -F "file=@tests/fixtures/contexte.md" "http://127.0.0.1:8597/api/projects/$pid/context" >/dev/null
          curl -sf -F "file=@tests/fixtures/figma_mockup.json" "http://127.0.0.1:8597/api/projects/$pid/figma" >/dev/null
          curl -sf "http://127.0.0.1:8597/api/projects/$pid/export" -o export.html
          grep -q "__PROTOLAB_MODEL__" export.html || { echo "::error::Export HTML sans modèle"; exit 1; }
          grep -q "pl-root" export.html || { echo "::error::Export HTML sans lecteur"; exit 1; }
          ls -l dist/ProtoLab.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ProtoLab-windows
          path: dist/ProtoLab.exe
          if-no-files-found: error

      - name: Joindre l'exe à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="ProtoLab-${{ steps.version.outputs.version }}.exe"
          cp dist/ProtoLab.exe "dist/$name"
          gh release upload "${{ github.event.release.tag_name }}" "dist/$name" --clobber
